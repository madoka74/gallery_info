<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EBEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1113" media="(prefers-color-scheme: dark)">
<title>가까운 전시</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가까운 전시">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one phone-width column. Snap-scrolling full-height cards: the poster hangs on a gallery-wall panel, a museum wall label sits underneath. */
:root{
  --bg:#E8EBEA; --surface:#FFFFFF; --wall:#DCE1DF; --fg:#14171A; --muted:#5C6568; --line:#D2D8D6; --chip:#F2F4F3;
  --accent:#2C43CF; --accent-ink:#FFFFFF; --stamp:#B3261E; --stamp-bg:rgba(255,255,255,.62); --star:#C98A0C; --heart:#D2375A; --warn:#B4500F; --warn-bg:#FBEBDD; --soft:#E9ECFB;
  --f-display:"Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1113; --surface:#191C1F; --wall:#212529; --fg:#ECEFEE; --muted:#9AA3A6; --line:#2C3135; --chip:#23272B;
  --accent:#8A98FF; --accent-ink:#0D1030; --stamp:#FF7A6E; --stamp-bg:rgba(20,22,25,.6); --star:#F2B544; --heart:#FF6F89; --warn:#F5A35C; --warn-bg:#3A2614; --soft:#22264A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1113; --surface:#191C1F; --wall:#212529; --fg:#ECEFEE; --muted:#9AA3A6; --line:#2C3135; --chip:#23272B;
  --accent:#8A98FF; --accent-ink:#0D1030; --stamp:#FF7A6E; --stamp-bg:rgba(20,22,25,.6); --star:#F2B544; --heart:#FF6F89; --warn:#F5A35C; --warn-bg:#3A2614; --soft:#22264A; color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;max-width:480px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px}
.brand{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;white-space:nowrap}
.brand i{font-style:normal;color:var(--accent)}
.ctx{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx button{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.ctx svg{width:14px;height:14px}
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0}

/* feed */
.feed{overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{height:calc(100% - 16px);margin-block:8px;scroll-snap-align:center;scroll-snap-stop:always;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.poster{flex:1 1 auto;min-height:150px;background:var(--wall);position:relative;display:flex;justify-content:center;padding:54px 20px 18px}
.frame{height:100%;aspect-ratio:3/4;max-width:100%;background:var(--line);box-shadow:0 14px 28px rgba(0,0,0,.20),0 2px 5px rgba(0,0,0,.14)}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.ovl{position:absolute;inset:12px 12px auto 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);font-size:12px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--fg);font-weight:500}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.icon-btn svg{width:20px;height:20px}
[data-star] svg,[data-heart] svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
[data-star][aria-pressed="true"]{color:var(--heart)}
[data-star][aria-pressed="true"] svg{fill:currentColor}
[data-heart][aria-pressed="true"]{color:var(--star)}
[data-heart][aria-pressed="true"] svg{fill:currentColor}

.info{flex:0 0 auto;max-height:64%;overflow-y:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--soft);color:var(--accent)}
.pill.closing{background:var(--warn-bg);color:var(--warn)}
.pill.soon{border:1px dashed var(--muted);color:var(--fg);padding:2px 8px}
.pill.ended{background:var(--chip);color:var(--muted)}
.multi{margin-left:auto;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.title{margin:0;font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.22;letter-spacing:-.02em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.label{margin:0;display:grid;grid-template-columns:44px minmax(0,1fr);gap:7px 12px;font-size:13.5px;border-top:1px solid var(--line);padding-top:12px}
.label dt{color:var(--muted);font-size:12px;letter-spacing:.06em;padding-top:1px}
.label dd{margin:0;min-width:0}
.place{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.place strong{font-weight:600;display:block}
.place small{color:var(--muted);font-size:12px}
.place .icon-btn{width:34px;height:34px;background:var(--chip);margin-top:-4px}
.place .icon-btn svg{width:18px;height:18px}

.loader{height:96px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center}
.loader .dots{display:inline-flex;gap:4px;margin-right:8px;vertical-align:middle}
.loader .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:b 1s infinite ease-in-out}
.loader .dots i:nth-child(2){animation-delay:.15s}.loader .dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}

.empty{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px;padding:0 8px}
.empty h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:800}
.empty p{margin:0;color:var(--muted);max-width:32ch}

/* pages (MY, settings) */
.page{overflow-y:auto;padding-block:8px 24px;scrollbar-width:thin}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.sec h3{margin:0;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.sec h3 .mono{color:var(--fg)}
.note{margin:0;font-size:12.5px;color:var(--muted)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

.vlist,.alist,.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px;padding-block:9px;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow .icon-btn{width:34px;height:34px;background:var(--chip)}
.vrow .icon-btn svg{width:18px;height:18px}
.vtext{min-width:0}
.vtext strong{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtext small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow.off .vtext{opacity:.5}
.switch{position:relative;display:inline-block;width:40px;height:24px;border-radius:999px;cursor:pointer}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch .track{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px)}
.mv{display:flex;flex-direction:column}
.mv button{width:28px;height:17px;display:grid;place-items:center;color:var(--muted)}
.mv button:disabled{opacity:.25;cursor:default}
.mv svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}
.del{height:30px;min-width:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:12px;padding-inline:6px}
.del svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none}
.del[data-armed]{background:var(--heart);color:var(--surface);font-weight:600}
.field{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px} /* 16px 미만이면 아이폰이 입력할 때 화면을 확대함 */
input[type=date].field{min-height:44px;-webkit-appearance:none;appearance:none}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.btn{padding:7px 14px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--chip);color:var(--fg)}
.btn.danger[data-armed]{background:var(--heart);color:var(--surface)}

.ovl-r{display:flex;align-items:center;gap:6px;flex:none}
.ovl>.chip{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;line-height:18px}
.ovl .icon-btn{width:34px;height:34px}
.ovl .icon-btn svg{width:19px;height:19px}
.dchip{display:inline-flex;align-items:center;height:30px;padding:0 10px;white-space:nowrap;flex:none;border-radius:999px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:500;background:var(--surface);color:var(--fg)}
.dchip.closing{background:var(--warn);color:var(--surface)}
.dchip.soon{border:1px dashed var(--muted);background:var(--surface)}
.dchip.ended{color:var(--muted)}
.card.is-ended{opacity:.6}
.frame{position:relative}
.newtag{position:absolute;top:-11px;left:-11px;z-index:2;padding:6px 11px;border-radius:7px;background:#FF2D55;color:#fff;font-family:var(--f-mono);font-size:14px;font-weight:700;letter-spacing:.1em;line-height:1;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);animation:newpulse 1.3s ease-in-out infinite}
@keyframes newpulse{0%{box-shadow:0 3px 10px rgba(0,0,0,.35),0 0 0 0 rgba(255,45,85,.75);opacity:1}45%{opacity:.45}60%{box-shadow:0 3px 10px rgba(0,0,0,.35),0 0 0 14px rgba(255,45,85,0);opacity:1}100%{box-shadow:0 3px 10px rgba(0,0,0,.35),0 0 0 0 rgba(255,45,85,0);opacity:1}}
.newhead{color:#FF2D55;font-weight:600}
.stamp{position:absolute;left:50%;top:50%;z-index:2;transform:translate(-50%,-50%) rotate(-14deg);display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 18px;border:4px solid var(--stamp);outline:2px solid var(--stamp);outline-offset:4px;border-radius:12px;background:var(--stamp-bg);color:var(--stamp);white-space:nowrap;pointer-events:none}
.stamp b{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,8vw,36px);letter-spacing:.1em}
.stamp small{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em}
.card.is-visited .frame img{opacity:.42;filter:grayscale(.6)}
.card.is-visited .info{opacity:.55}
[data-visit][aria-pressed="true"]{color:var(--stamp)}
[data-visit] svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge.new{background:var(--accent);color:var(--accent-ink)}
.stamp{pointer-events:auto;cursor:pointer}
.dlg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.dlg-in{width:100%;max-width:480px;background:var(--surface);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.dlg-in h3{margin:0;font-family:var(--f-display);font-size:19px;font-weight:800;line-height:1.3}
.dlg-in .note{margin-top:-8px}
.dlg-row{display:flex;gap:8px;flex-wrap:wrap}
.dlg-row .btn{flex:1;padding:11px 14px;font-size:14px}
.locnow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.locnow strong{font-size:15px}
.locnow small{display:block;color:var(--muted);font-size:12px}
.locform{display:flex;gap:8px}
.locform .field{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:5px 10px;border-radius:999px;background:var(--chip);font-size:12.5px}
.pv{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.pv label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.pv .pvres{font-size:13px;display:flex;flex-direction:column;gap:4px}
.pv .pvres li{list-style:none}
.pv .pvres ul{margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.pv .warn{color:var(--warn);font-size:12.5px}
.pv .ok{color:var(--accent);font-size:12.5px;font-weight:600}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.syncstat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.syncstat .dot{width:8px;height:8px;border-radius:50%;background:#2DB55D;flex:none}
.syncstat .dot.err{background:var(--warn)}
.codebox{display:flex;gap:8px;align-items:center;margin-top:10px}
.codebox input{flex:1;min-width:0;font-family:var(--f-mono);font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.syncrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.synchead{display:flex;align-items:center;gap:10px}
.synchead h3{margin:0}
.synchead .syncstat{flex:1;justify-content:flex-end;font-family:var(--f-mono);font-size:12px}
.morerow{display:flex;align-items:center;gap:14px;padding-block:6px;flex-wrap:wrap}
.morelab{font-size:12px;color:var(--muted);width:52px}
.syncline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px}
.syncstat .dot.off{background:var(--muted)}
.linkbtn{background:none;border:0;padding:4px 0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
#restoredet{margin-top:8px}
#restoredet summary{font-size:14px;padding-block:6px;cursor:pointer}
.note.bad{color:var(--warn)}
.restorebox{margin-top:12px;padding:12px;border-radius:12px;background:var(--chip);display:flex;flex-direction:column;gap:8px}
.restorebox p{margin:0;font-size:13px}
.duprow{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.dside{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px;background:var(--chip)}
.dside strong{font-size:14px;font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.dside small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.dmid{font-size:11.5px;color:var(--muted);padding-left:10px}
.dbtns{display:flex;gap:8px;justify-content:flex-end}
.srow small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .bad{color:var(--warn)}
details summary{cursor:pointer;font-size:13px;color:var(--fg);padding-block:4px}
.btn.sm{padding:6px 10px;font-size:12.5px}
.rhead{display:flex;align-items:center;gap:8px;width:100%;padding:13px 2px;border-top:1px solid var(--line);text-align:left;font-size:15px;font-weight:600;color:var(--fg)}
.vlist>li.rgrp:first-child .rhead{border-top:0}
.rhead .car{width:16px;height:16px;flex:none;transition:transform .15s;color:var(--muted)}
.rhead[aria-expanded="true"] .car{transform:rotate(90deg)}
.rhead .cnt{font-family:var(--f-mono);font-size:12.5px;font-weight:400;color:var(--muted)}
.rhead .ncnt{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.06em;color:#fff;background:#FF2D55;border-radius:999px;padding:3px 8px}
.rgrp>ul{list-style:none;margin:0 0 6px;padding:0 0 0 4px}
.vnew{display:inline-block;vertical-align:2px;margin-right:6px;font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.06em;line-height:1;color:#fff;background:#FF2D55;border-radius:4px;padding:3px 5px}
.offhead{padding-block:10px 4px;font-size:12px;color:var(--muted);letter-spacing:.06em;border-top:1px solid var(--line)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);padding-block:6px 8px;border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:6px;font-size:11.5px;color:var(--muted);position:relative}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.nav button[aria-current="page"]{color:var(--fg);font-weight:600}
.nav button[aria-current="page"] svg{stroke:var(--accent)}
.nav .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--star);color:var(--surface);font-size:10px;line-height:16px;padding:0 4px;font-family:var(--f-mono)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:30;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 1 30%}
.err{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px;color:var(--fg);max-width:36ch}
.ext{color:var(--accent);text-decoration:underline;text-underline-offset:2px}

/* ===== 마무리 정리: 간격(4·8·12·16)·글자 크기·아이콘을 한 기준으로 ===== */
/* 상단 오른쪽: 아이콘 + 숫자 */
.ctx{gap:12px;font-size:13px}
.stat{display:inline-flex;align-items:center;gap:4px;color:var(--muted);line-height:1}
.stat svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round;flex:none}
.stat .mono{color:var(--fg);font-size:13px}
.stat.h svg{color:var(--heart);fill:currentColor;stroke:currentColor}
.stat.s svg{color:var(--star);fill:currentColor;stroke:currentColor}
.stat.v svg{color:var(--stamp)}
/* 카드 */
.chip .sep{display:inline-block;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.55;margin:0 7px;vertical-align:middle}
.ovl>.chip{padding:0 12px;height:30px;line-height:30px}
.multi{color:var(--muted);font-size:12px}
.meta{min-height:24px}
.label{gap:8px 12px}
/* 하트 버튼: 배경 없이 크게, 다크에서도 잘 보이게 */
.icon-btn[data-heart]{background:transparent!important;width:40px;height:40px;color:var(--muted);margin:-8px -8px -8px 0}
.icon-btn[data-heart] svg{width:23px;height:23px;stroke-width:1.9}
.icon-btn[data-heart][aria-pressed="true"]{color:var(--star)}
.place .icon-btn[data-heart]{margin-top:-10px}
/* 목록 구분선·끝 표시 */
.divider{display:flex;align-items:center;gap:12px;height:44px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.divider:empty::after{display:none}
.divider span{display:inline-flex;align-items:center;gap:6px;letter-spacing:.04em}
.divider span svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.divider b{color:var(--fg);font-weight:500}
.divider.new{color:#FF2D55;font-weight:700}
.divider.new span{font-family:var(--f-mono);letter-spacing:.08em}
.end{font-family:var(--f-mono);font-size:12px;color:var(--muted);opacity:.7}
.loader{height:72px}
/* 설정 공통 */
.sec{gap:12px;padding:16px}
.sec h3{min-height:24px;font-size:13px}
.sec h3 .cnt{margin-left:auto;display:inline-flex;align-items:center;gap:6px;letter-spacing:0}
.cnt .mono{color:var(--fg);font-size:13px;font-weight:500}
.slash{color:var(--line);font-weight:400}
.note{font-size:12px;line-height:1.5}
details>summary{list-style:none;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:4px 0;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);margin:0 4px 0 2px;transition:transform .15s}
details[open]>summary::before{transform:rotate(45deg)}
details[open]>summary{margin-bottom:8px}
.btn{height:36px;padding:0 14px;border-radius:10px;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.field{height:44px;padding:0 12px}
.locform,.codebox{gap:8px;align-items:stretch;margin:0}
.locform .btn,.codebox .btn{height:44px}
.locnow{min-height:40px}
.locnow small{margin-top:2px}
.chips button{height:30px;padding:0 12px}
/* 공간 목록 */
.vlist{margin-inline:-4px}
.rhead{height:52px;padding:0 4px;gap:10px;font-size:15px}
.rhead .car{width:32px;height:14px;padding:0 9px;box-sizing:content-box;margin:0 -9px}  /* 하트 칸(32px)과 같은 폭·중심 */
.rhead{gap:10px}
.rhead .cnt{display:inline-flex;align-items:center;gap:6px;margin-left:2px}
.rhead .cnt .mono{color:var(--muted);font-weight:400}
.rhead .ncnt{height:22px;line-height:16px}
.rgrp>ul{margin:0 0 8px;padding:0}
.vrow{grid-template-columns:32px minmax(0,1fr) auto auto;gap:10px;min-height:60px;padding:8px 4px}
.vrow .icon-btn[data-heart]{width:40px;height:40px;margin:0 -4px}
.vtext strong{font-size:14.5px;line-height:1.35}
.vtext small{margin-top:2px;line-height:1.4}
.vtext small .mono{font-size:11.5px}
i.dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6;margin:0 6px;vertical-align:middle}
.vnew{vertical-align:1px;padding:3px 5px 2px}
.offhead{padding:12px 4px 4px}
.mv{margin-left:-2px}
.vrow>span:empty{display:none}
/* 백업 */
.synchead{min-height:28px}
.synchead .syncstat{font-size:12px}
.syncrow,.codebox{margin-top:0}
#restoredet{margin-top:0}
#restorebox:empty{display:none}
.placebtn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0;padding:0}
.placebtn strong{display:inline-flex;align-items:center;gap:4px}
.placebtn strong svg{width:13px;height:13px;color:var(--accent);flex:none}
.mapsheet{gap:12px}
.maphead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.maphead strong{font-size:17px}
.mapx{background:var(--chip);width:34px;height:34px}
.mapx svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}
#mapbox{height:min(52vh,360px);border-radius:12px;overflow:hidden;background:var(--wall);border:1px solid var(--line)}
.mapsheet .dlg-row a.btn{flex:1;height:44px;text-decoration:none}
.leaflet-tooltip.mtip{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.18);font:600 12px var(--f-body);padding:3px 8px}
.leaflet-tooltip.mtip.strong{font-size:13px}

.leaflet-container{font-family:var(--f-body)}
.walkt{display:inline-flex;align-items:center;gap:3px;color:var(--fg);font-weight:600}
.walkt svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ctxsearch{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.ctx .ctxsearch{display:grid;place-items:center;padding:0;border:0;background:transparent;-webkit-tap-highlight-color:transparent}
.ctxsearch svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.ctxsearch.on{color:var(--accent)}
.views .view{transition:top .22s ease}
.views.searching .view{top:56px}
.sbar{position:absolute;left:0;right:0;top:0;height:48px;display:flex;align-items:center;gap:8px;z-index:3;animation:sdown .22s ease}
@keyframes sdown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.sbar .field{flex:1;min-width:0;height:44px;border-radius:12px;background:var(--surface);padding-left:38px}
.sbar .sicon{position:absolute;left:12px;width:18px;height:18px;pointer-events:none;color:var(--muted);background:currentColor;-webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>') center/contain no-repeat;mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>') center/contain no-repeat}
.sbar .sclose{height:44px;padding:0 6px;font-size:14px;color:var(--accent);font-weight:600;flex:none}
.view.searchmode>:not(#sres){display:none!important}
.sempty{height:120px;display:grid;place-items:center;color:var(--muted);font-size:14px}
.kpin{display:flex;flex-direction:column;align-items:center;transform:translateY(8px)}
.kpin.to{transform:translateY(10px)}
.kpin span{background:#fff;color:#14171A;border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.18);font:600 12px var(--f-body);padding:3px 8px;margin-bottom:6px;white-space:nowrap}
.kpin i{display:block;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);background:#1A5CFF}
.kpin.to i{width:22px;height:22px;background:#FF2D55}
.kpin.to span{font-size:13px}
.locnow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.locnow strong{font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locbtn{height:44px!important;width:96px;flex:none;gap:4px}
.locbtn svg{width:15px;height:15px}
.rchip{display:inline-flex;align-items:center;height:32px;border-radius:999px;background:var(--chip);padding-left:12px;font-size:12.5px}
.rchip.on{background:var(--soft);color:var(--accent);font-weight:600}
.rchip>button:first-child{height:32px}
.rchip button{background:none!important;padding:0!important;border-radius:0!important}
.rchip .rx{width:30px;height:32px;display:grid;place-items:center;color:var(--muted)}
.rchip .rx svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2}
.chips{gap:8px}
.alist .arow{min-height:52px}
.alist .clr{justify-content:center;min-height:40px}
.h3btn{font:inherit;color:inherit;letter-spacing:inherit;padding:0;cursor:default}
.alist:empty,#probebox:empty{display:none}
.restorebox{margin-top:0}
.morerow{min-height:32px;padding:0}
.linkbtn{font-size:13px;color:var(--fg);text-decoration-color:var(--line)}
/* 하단 탭 뱃지: NEW는 빨강, 개수는 파랑 */
.nav .badge{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav .badge.new{background:#FF2D55;color:#fff}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand">가까운 <i>전시</i></div>
    <div class="ctx" id="ctx"></div>
  </header>
  <main class="views" id="views">
    <form class="sbar" id="sbar" role="search" hidden><span class="sicon"></span><input class="field" id="sq" type="search" placeholder="전시·작가·공간" autocomplete="off" enterkeyhint="search"><button type="button" class="sclose" data-act="search-close">닫기</button></form>
    <section class="view feed" id="view-near" aria-label="근처 전시"></section>
    <section class="view feed" id="view-heart" aria-label="즐겨찾는 공간 전시" hidden></section>
    <section class="view feed" id="view-my" aria-label="MY" hidden></section>
    <section class="view page" id="view-settings" aria-label="설정" hidden></section>
  </main>
  <nav class="nav" aria-label="탭">
    <button data-tab="near" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>근처</button>
    <button data-tab="heart"><svg viewBox="0 0 24 24"><path d="M12 3.6l2.55 5.2 5.75.84-4.16 4.05.98 5.72L12 16.7l-5.12 2.7.98-5.72L3.7 9.64l5.75-.84z"/></svg>즐겨찾기<span class="badge new" id="heartbadge" hidden></span></button>
    <button data-tab="my"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.1A4.3 4.3 0 0 1 12 7.5a4.3 4.3 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></svg>MY<span class="badge" id="mybadge" hidden></span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>설정<span class="badge new" id="setbadge" hidden></span></button>
  </nav>
</div>

<div class="dlg" id="visitdlg" hidden>
  <div class="dlg-in" role="dialog" aria-modal="true" aria-labelledby="visitdlg-title">
    <h3 id="visitdlg-title">관람 날짜</h3>
    <p class="note" id="visitdlg-sub"></p>
    <input class="field" id="visitdate" type="date">
    <div class="dlg-row">
      <button class="btn" data-act="visit-save">저장</button>
      <button class="btn ghost" data-act="visit-remove">본 전시 표시 빼기</button>
      <button class="btn ghost" data-act="visit-close">닫기</button>
    </div>
  </div>
</div>
<div class="dlg" id="mapdlg" hidden>
  <div class="dlg-in mapsheet" role="dialog" aria-modal="true" aria-labelledby="mapdlg-title">
    <div class="maphead"><div class="vtext"><strong id="mapdlg-title"></strong><small id="mapdlg-sub"></small></div><button class="icon-btn mapx" data-act="map-close" aria-label="닫기"><svg viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8"/></svg></button></div>
    <div id="mapbox"></div>
    <div class="dlg-row"><a class="btn" id="map-kakao" target="_blank" rel="noopener">카카오맵 길찾기</a><a class="btn ghost" id="map-apple" target="_blank" rel="noopener">Apple 지도</a></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
/* ---------- 설정값 ---------- */
// 페이지와 Worker가 같은 주소에서 돌면 비워 둡니다. 앱으로 옮길 때는 Worker 주소를 넣으세요.
const API = '';
// 위치 권한이 없을 때 임시로 쓰는 기준점
const FALLBACK = { name:'강남역', lat:37.4979, lng:127.0276 };

/* ---------- 상태 (이 브라우저에 저장) ---------- */
const KEY='gakkaun-jeonsi-v2';
// prefs: 공간별 내 설정 {heart, on, v:{공간 스냅샷}} · order: 직접 정렬 순서 · hidden: 숨긴 공간
// loc: 기준 위치 {mode:'gps'|'place', gps, place, recent} · prefs: 공간별 내 설정 {heart, on, v} · order: 직접 정렬 순서
const defaults = () => ({ loc:{ mode:'gps', gps:null, place:null, recent:[] }, sort:'distance', prefs:{}, order:[], stars:[] });
const OLD_STATIONS = { gangnam:FALLBACK, sinsa:{name:'신사역',lat:37.5163,lng:127.0203}, jamsil:{name:'잠실역',lat:37.5133,lng:127.1001}, gwanghwamun:{name:'광화문역',lat:37.5710,lng:126.9768} };
let S; try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
if(S&&Array.isArray(S.venues)){ // 아주 예전 저장 형식
  const prefs={}; S.venues.forEach(v=>{prefs[v.id]={heart:!!v.heart,on:v.on!==false,v:{id:v.id,name:v.name,addr:v.addr||'',lat:v.lat,lng:v.lng}}});
  S={...S,prefs,order:S.venues.map(v=>v.id)}; delete S.venues;
}
if(S&&!S.loc){ // 역 버튼·숨기기가 있던 형식 → 기본은 내 위치, 숨긴 공간은 스위치 끔으로
  const st=OLD_STATIONS[S.origin];
  S.loc={ mode:'gps', gps:S.gps||null, place:st?{...st}:null, recent:st?[{...st}]:[] };
  (S.hidden||[]).forEach(h=>{ S.prefs=S.prefs||{}; const p=S.prefs[h.id]||(S.prefs[h.id]={heart:false}); p.on=false; p.v=p.v||{id:h.id,name:h.name,addr:'',lat:FALLBACK.lat,lng:FALLBACK.lng}; });
  delete S.origin; delete S.gps; delete S.hidden;
}
if(!S||typeof S.prefs!=='object'||!S.loc) S=defaults();
// seen: 한 번 본 새 전시 · since: 이 기능을 처음 쓴 시각(그 전부터 있던 전시는 NEW 아님) · visited: 본 전시
S.seen=S.seen||[]; S.visited=S.visited||{}; if(!S.since){S.since=new Date().toISOString();}
// 관람 날짜는 'YYYY-MM-DD'로 (예전 형식은 변환)
const localYmd=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
Object.values(S.visited).forEach(r=>{if(r.at&&r.at.length>10)r.at=localYmd(new Date(r.at))});
// 별표 전시는 끝나면 자동으로 빠짐 (관람 기록은 남음)
S.stars=S.stars.filter(s=>s.e&&s.e.end>=localYmd());
const save = () => { try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} syncSoon(); };

/* ---------- 도우미 ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const days=(a,b)=>Math.round((b-a)/86400000);
const WD='일월화수목금토';
const md=d=>`${d.getMonth()+1}.${pad(d.getDate())}`;
function period(e){
  const a=D(e.start),b=D(e.end);
  const l=`${a.getFullYear()}.${pad(a.getMonth()+1)}.${pad(a.getDate())}`;
  const r=a.getFullYear()===b.getFullYear()?`${pad(b.getMonth()+1)}.${pad(b.getDate())}`:`${b.getFullYear()}.${pad(b.getMonth()+1)}.${pad(b.getDate())}`;
  return `${l} – ${r}`;
}
function status(e){
  const a=D(e.start),b=D(e.end);
  if(b<today) return {kind:'ended',label:'종료',dday:'종료'};
  if(a>today){const n=days(today,a);return {kind:'soon',label:`${md(a)} 개막`,dday:`개막 D-${n}`}}
  const n=days(today,b);
  if(n===0) return {kind:'closing',label:'오늘 마감',dday:'D-day'};
  if(n<=7) return {kind:'closing',label:'마감 임박',dday:`D-${n}`};
  return {kind:'on',label:'진행 중',dday:`D-${n}`};
}
function origin(){
  if(S.loc.mode==='gps'&&S.loc.gps) return {name:'현재 위치',lat:S.loc.gps.lat,lng:S.loc.gps.lng};
  if(S.loc.place) return S.loc.place;
  return {...FALLBACK,name:FALLBACK.name+' (임시)'};
}
function dist(v){
  const o=origin(),R=6371000,r=x=>x*Math.PI/180;
  const h=Math.sin(r(v.lat-o.lat)/2)**2+Math.cos(r(o.lat))*Math.cos(r(v.lat))*Math.sin(r(v.lng-o.lng)/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtDist=m=>m<1000?`${Math.max(10,Math.round(m/10)*10)}m`:`${(m/1000).toFixed(1)}km`;
const isHeart=id=>!!(S.prefs[id]&&S.prefs[id].heart);
const isOn=id=>!(S.prefs[id]&&S.prefs[id].on===false);
function setPref(v,patch){const p=S.prefs[v.id]||(S.prefs[v.id]={heart:false,on:true});Object.assign(p,patch);p.v=slim(v);save();return p}
const slim=v=>({id:v.id,name:v.name,addr:v.addr||'',lat:v.lat,lng:v.lng});
/* 지역: 주소 앞머리로, 없으면 좌표로 (서울 공간은 주소에 '서울'이 빠진 경우가 많음) */
const REGIONS=[
  {n:'서울',re:/^서울/},
  {n:'경기·인천',re:/^(경기|인천)/,pts:[[37.27,127.01],[37.45,126.70],[37.74,127.05],[37.66,126.78],[37.2,127.5],[37.0,127.2]]},
  {n:'강원',re:/^강원/,pts:[[37.88,127.73],[37.75,128.9],[37.34,127.92],[37.45,129.16]]},
  {n:'대전·세종·충청',re:/^(대전|세종|충북|충남|충청)/,pts:[[36.35,127.38],[36.64,127.49],[36.81,127.15],[36.5,126.8],[36.48,127.29]]},
  {n:'광주·전라',re:/^(광주|전북|전남|전라|전남광주)/,pts:[[35.16,126.85],[35.82,127.15],[34.81,126.39],[34.95,127.70]]},
  {n:'대구·경북',re:/^(대구|경북|경상북)/,pts:[[35.87,128.60],[35.85,129.22],[36.02,129.36],[36.57,128.73]]},
  {n:'부산·울산·경남',re:/^(부산|울산|경남|경상남)/,pts:[[35.18,129.07],[35.54,129.31],[35.23,128.68],[35.18,128.10]]},
  {n:'제주',re:/^제주/,pts:[[33.45,126.55],[33.25,126.56]]}
];
function regionOf(v){
  const a=String(v.addr||'').trim();
  for(const r of REGIONS)if(r.re.test(a))return r.n;
  if(!isFinite(v.lat))return '기타';

const stampHTML=key=>`<div class="stamp" role="button" tabindex="0" data-stamp="${esc(key)}" aria-label="관람 날짜 ${fmtDay(S.visited[key].at)}, 눌러서 바꾸기"><b>관람 완료</b><small>${fmtDay(S.visited[key].at)}</small></div>`;
function cardHTML(e,v,meta={}){
  const st=status(e),d=dist(v),key=keyOf(e);
  const starred=!!starOf(e,v),hearted=isHeart(v.id),visited=!!visitKey(e,v),fresh=isNewE(e,v);

      <div class="ovl">
        <span class="chip mono">${meta.rank?`<b>${pad(meta.rank)}</b><i class="sep"></i>`:''}${fmtDist(d)}</span>
        <div class="ovl-r"><span class="dchip ${st.kind}">${st.dday}</span><button class="icon-btn" data-visit="${esc(e.id)}" aria-pressed="${visited}" aria-label="본 전시로 표시">${ICON.visit}</button><button class="icon-btn" data-star="${esc(e.id)}" aria-pressed="${starred}" aria-label="보고 싶은 전시">${ICON.heart}</button></div>

    </div>
    <div class="info">
      <div class="meta"><span class="pill ${st.kind}">${st.label}</span><span>${esc(e.genre||'전시')}</span>${meta.total>1?`<span class="multi" title="이 공간의 전시">${meta.idx}/${meta.total}</span>`:''}</div>
      <div><h2 class="title">${esc(e.title)}</h2>${e.sub?`<p class="sub">${esc(e.sub)}</p>`:''}</div>
      <dl class="label">
        ${e.artist?`<dt>작가</dt><dd>${esc(e.artist)}</dd>`:''}
        <dt>기간</dt><dd class="mono">${period(e)}</dd>
        <dt>장소</dt><dd class="place"><button class="placebtn" data-map="${esc(e.id)}" aria-label="${esc(v.name)} 지도"><strong>${esc(v.name)}${ICON.pin}</strong>${e.hall||v.addr?`<small>${esc([e.hall,v.addr].filter(Boolean).join(' · '))}</small>`:''}</button><button class="icon-btn" data-heart="${esc(v.id)}" aria-pressed="${hearted}" aria-label="즐겨찾는 공간">${ICON.star}</button></dd>
        ${e.fee?`<dt>관람</dt><dd>${esc(e.fee)}</dd>`:''}
        ${e.link?`<dt>정보</dt><dd><a class="ext" href="${esc(e.link)}" target="_blank" rel="noopener">자세히 보기</a></dd>`:''}
      </dl>
    </div>

}
function venueCards(venues,startRank,withRank){
  let html='';
  venues.forEach((v,i)=>{v.ex.forEach((e,j)=>{remember(e,v);html+=cardHTML(e,v,{rank:withRank?startRank+i+1:0,idx:j+1,total:v.ex.length})})});
  return html;
}
// 하트한 공간 이름·좌표 스냅샷을 최신으로 유지
function register(venues){let ch=false;venues.forEach(v=>{const p=S.prefs[v.id];if(p){p.v=slim(v);ch=true}});if(ch)save()}

/* ---------- 전체 공간 목록 (서버) ---------- */
let allVenues=null,allKey='';
async function loadAll(force){
  const o=origin(),k=o.lat+','+o.lng;
  if(allVenues&&allKey===k&&!force)return allVenues;
  const r=await api(`/api/allvenues?lat=${o.lat}&lng=${o.lng}`);
  allVenues=r.venues;allKey=k;register(allVenues);updateSetBadge();
  resolveOrphans(allVenues).then(ch=>{if(ch&&tab==='settings'){const page=$('#view-settings'),top=page.scrollTop;renderVList();page.scrollTop=top}});
  return allVenues;
}

/* ---------- 근처 피드: 서버에서 공간 10곳씩 ---------- */
const near={el:$('#view-near'),page:0,hasMore:true,loading:false,total:0,shown:0,sentinel:null,dirty:true,error:null};
const nearIO=new IntersectionObserver(ents=>{if(ents.some(en=>en.isIntersecting))loadMore()},{root:near.el,rootMargin:'0px 0px 150% 0px'});
function feedQuery(){
  const off=Object.keys(S.prefs).filter(id=>!isOn(id));
  return {exclude:off};
}
async function resetNear(){
  near.dirty=false;
  if(S.loc.mode==='gps'&&!gpsFresh()){
    near.el.innerHTML='<div class="loader"><span><span class="dots"><i></i><i></i><i></i></span>위치 확인 중</span></div>';
    await refreshGps(false);
  }near.page=0;near.hasMore=true;near.loading=false;near.total=0;near.shown=0;near.error=null;
  near.el.innerHTML='';near.el.scrollTop=0;
  near.sentinel=document.createElement('div');near.sentinel.className='loader';near.el.appendChild(near.sentinel);
  nearIO.disconnect();nearIO.observe(near.sentinel);
  loadMore();
}
async function loadMore(){
  if(near.loading||!near.hasMore)return;
  near.loading=true;
  near.sentinel.innerHTML=`<span><span class="dots"><i></i><i></i><i></i></span>불러오는 중</span>`;
  try{
    const res=await api('/api/feed',{page:near.page,...feedQuery()});
    near.page++;near.hasMore=res.hasMore;near.total=res.total;
    if(!res.venues.length&&near.page===1){
      near.el.innerHTML=`<div class="empty"><h3>근처에 열린 전시가 없어요</h3><p>기준 위치나 꺼 둔 공간을 확인해 보세요.</p><button class="btn" data-goto="settings">설정 열기</button></div>`;
      updateTop();return;
    }
    register(res.venues);
    near.sentinel.insertAdjacentHTML('beforebegin',venueCards(res.venues,near.shown,true));
    near.shown+=res.venues.length;
    observePosters(near.el);
    near.sentinel.innerHTML=near.hasMore?'':`<span class="end">끝</span>`;
    updateTop();
  }catch(err){
    near.error=err.message;
    near.sentinel.innerHTML=`<div class="err"><span>${esc(err.message)}</span><button class="btn ghost" data-act="retry">다시 시도</button></div>`;
  }finally{near.loading=false}
  // 받은 양이 적어 끝이 여전히 가까우면 이어서
  if(near.hasMore&&!near.error){const fr=near.el.getBoundingClientRect(),sr=near.sentinel.getBoundingClientRect();if(sr.top-fr.bottom<fr.height*1.5)loadMore()}
}

/* ---------- 하트 피드 ---------- */
// 설정 목록 = 서버의 전체 공간 + 지금 전시가 없는 하트 공간. 스위치를 끈 공간은 맨 아래로
function settingsList(){const l=settingsListRaw();return [...l.filter(v=>isOn(v.id)),...l.filter(v=>!isOn(v.id))]}
function settingsListRaw(){
  const list=(allVenues||[]).map(v=>({...v}));
  const have=new Set(list.map(v=>v.id));
  Object.entries(S.prefs).forEach(([id,p])=>{if(p.heart&&!have.has(id)&&p.v)list.push({...p.v,active:0})});
  if(S.sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  else if(S.sort==='custom'){const idx=new Map(S.order.map((id,i)=>[id,i]));list.sort((a,b)=>(idx.has(a.id)?idx.get(a.id):1e6+dist(a))-(idx.has(b.id)?idx.get(b.id):1e6+dist(b)))}
  else list.sort((a,b)=>dist(a)-dist(b));
  return list;
}
let heartInfo={venues:0,count:0},heartSeq=0;
async function renderHearts(){
  const el=$('#view-heart'),seq=++heartSeq;
  try{await loadAll()}catch(e){}
  if(seq!==heartSeq)return;
  const hv=settingsList().filter(v=>isHeart(v.id));
  heartInfo={venues:hv.length,count:0};updateTop();
  if(!hv.length){el.innerHTML=`<div class="empty"><h3>즐겨찾는 공간이 없어요</h3><p>카드나 설정에서 공간의 별을 눌러 보세요.</p><button class="btn" data-goto="settings">공간 고르기</button></div>`;return}
  el.innerHTML=`<div class="loader"><span><span class="dots"><i></i><i></i><i></i></span>불러오는 중</span></div>`;
  try{
    const res=await api('/api/venues',{ids:hv.map(v=>v.id)});
    if(seq!==heartSeq)return;
    register(res.venues);heartData=res.venues;updateHeartBadge();
    const withEx=res.venues.filter(v=>v.ex.length);
    const n=withEx.reduce((a,v)=>a+v.ex.length,0);
    heartInfo={venues:hv.length,count:n};updateTop();
    // 새로 들어온 전시는 거리·정렬과 관계없이 맨 위로. 확인해서 NEW가 사라지면 다음에 열 때 원래 자리로
    const fresh=[],rest=[];
    withEx.forEach((v,i)=>v.ex.forEach((e,j)=>{remember(e,v);(isNewE(e,v)?fresh:rest).push({e,v,meta:{rank:i+1,idx:j+1,total:v.ex.length}})}));
    const cards=list=>list.map(x=>cardHTML(x.e,x.v,x.meta)).join('');
    el.innerHTML=n
      ?(fresh.length?`<div class="divider new"><span>NEW ${fresh.length}</span></div>`+cards(fresh)+`<div class="divider"></div>`:'')
        +cards(rest)+`<div class="loader"><span class="end">끝</span></div>`
      :`<div class="empty"><h3>열린 전시가 없어요</h3><p>즐겨찾는 공간에 지금 전시가 없어요.</p></div>`;
    el.scrollTop=0;observePosters(el);
  }catch(err){
    if(seq!==heartSeq)return;
    el.innerHTML=`<div class="empty"><h3>불러오지 못했어요</h3><p>${esc(err.message)}</p><button class="btn" data-act="retry-heart">다시 시도</button></div>`;
  }
}

/* ---------- MY: 담은 전시(스냅샷)를 같은 카드로, 종료일 빠른 순 ---------- */
function renderMy(fromSync){
  const el=$('#view-my');
  const vlist=Object.values(S.visited).filter(r=>r&&r.e);
  const isVisited=s=>!!S.visited[keyOf(s.e)]||vlist.some(r=>sameEx(s.e,s.v||{},r.e,r.v||{}));
  // 위: 별표했고 아직 안 본 전시 (종료일 빠른 순) · 아래: 관람 기록 (최근에 본 순, 전시가 끝나도 유지)
  const starred=S.stars.filter(s=>!isVisited(s)).sort((a,b)=>D(a.e.end)-D(b.e.end)||D(a.e.start)-D(b.e.start));
  const log=Object.entries(S.visited).filter(([,r])=>r&&r.e).map(([k,r])=>({...r,k})).sort((a,b)=>b.at.localeCompare(a.at));
  starred.forEach(s=>remember(s.e,s.v));log.forEach(r=>remember(r.e,r.v));
  if(!starred.length&&!log.length){el.innerHTML=`<div class="empty"><h3>담은 전시가 없어요</h3><p>카드의 하트와 체크를 눌러 보세요.</p><button class="btn" data-goto="near">근처 전시 보기</button></div>`;return}
  el.innerHTML=starred.map(({e,v})=>cardHTML(e,v)).join('')
    +(log.length?`<div class="divider"><span>${ICON.visit}관람 기록 <b class="mono">${log.length}</b></span></div>`+log.map(r=>cardHTML(r.e,r.v)).join(''):'')
    +`<div class="loader"><span class="end">끝</span></div>`;
  el.scrollTop=0;observePosters(el);
  if(!fromSync)syncMy();
}
// MY를 열 때 담아 둔 전시의 최신 정보를 서버에서 받아 사본을 고침 (바뀐 게 있으면 다시 그림)
let mySyncAt=0;
async function syncMy(){
  if(Date.now()-mySyncAt<30e3)return;mySyncAt=Date.now();
  const ids=[...new Set([...S.stars.map(s=>s.v&&s.v.id),...Object.values(S.visited).map(r=>r&&r.v&&r.v.id)].filter(Boolean))];
  if(!ids.length)return;
  const before=JSON.stringify([S.stars,S.visited]);
  try{await api('/api/venues',{ids})}catch(e){return}
  if(JSON.stringify([S.stars,S.visited])!==before&&tab==='my'){const el=$('#view-my'),top=el.scrollTop;renderMy(true);el.scrollTop=top;updateTop()}
}

const ADMIN_KEY='gakkaun-admin';
let adminToken='';try{adminToken=localStorage.getItem(ADMIN_KEY)||''}catch(e){}
async function adminApi(path,body){
  const res=await fetch(API+path,{method:body?'POST':'GET',headers:{'content-type':'application/json','x-admin-token':adminToken},body:body?JSON.stringify(body):undefined});
  let d;try{d=await res.json()}catch(e){throw new Error(`서버 응답을 읽지 못했어요 (${res.status})`)}

/* ---------- 지도: 기준 위치 → 전시장 ----------
   카카오 JavaScript 키(KAKAO_JS_KEY)가 있으면 카카오 지도, 없거나 실패하면 오픈스트리트맵(키 필요 없음) */
const loadScript=src=>new Promise((ok,no)=>{const js=document.createElement('script');js.src=src;js.onload=ok;js.onerror=()=>no(new Error('지도를 불러오지 못했어요'));document.head.appendChild(js)});
let mapRoute=null,mapSeq=0,pendingRoute=null,kCur=[],kRedrawT=[];
let mapKind=null,kmap=null,klayers=[],lmap=null,llayer=null,leafletP=null,kakaoP=null;
function loadKakao(key){
  if(window.kakao&&kakao.maps&&kakao.maps.LatLng)return Promise.resolve();
  if(!kakaoP)kakaoP=loadScript(`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&autoload=false`)
    .then(()=>new Promise((ok,no)=>{if(!window.kakao||!kakao.maps)return no(new Error('카카오 지도 키·도메인을 확인해 주세요'));kakao.maps.load(ok)}))
    .catch(e=>{kakaoP=null;throw e});
  return kakaoP;
}
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  if(!leafletP){
    const css=document.createElement('link');css.rel='stylesheet';css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(css);
    leafletP=loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js').catch(e=>{leafletP=null;throw e});

// 경로 선: 지도 위에서 잘 보이도록 진한 파랑 + 흰 테두리 (지도는 늘 밝은 색이라 고정 색)
const ROUTE='#1A5CFF',ROUTE_EDGE='#FFFFFF';
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
async function drawKakao(o,v){
  const box=$('#mapbox');
  const a=new kakao.maps.LatLng(o.lat,o.lng),b=new kakao.maps.LatLng(v.lat,v.lng);
  if(!kmap)kmap=new kakao.maps.Map(box,{center:b,level:5});
  klayers.forEach(x=>x.setMap(null));klayers=[];
  // 시트가 다 펼쳐진 뒤에 크기를 다시 재고 그려야 선이 처음부터 제대로 보임
  await nextFrame();kmap.relayout();
  const fit=pts=>{const bd=new kakao.maps.LatLngBounds();pts.forEach(p=>bd.extend(p));kmap.setBounds(bd,70,48,48,48)};
  // 카카오 지도는 화면 맞춤 직후 선의 일부만 그려 두는 경우가 있어서(손으로 움직이면 다 보임),
  // 맞춤이 끝난 뒤 몇 번에 걸쳐 크기를 다시 재고 선을 다시 붙여 '움직인 것과 같은' 상태로 만듦
  // 지금 지도에 있어야 할 선만 다시 붙임 (예전 직선이 되살아나지 않게 항상 kCur 기준)
  const redrawOnIdle=lines=>{
    kCur=lines;kRedrawT.forEach(clearTimeout);
    const again=()=>{if(!kmap||$('#mapdlg').hidden)return;kmap.relayout();kmap.setCenter(kmap.getCenter());kCur.forEach(l=>{l.setMap(null);l.setMap(kmap)})};
    kRedrawT=[0,150,400,900].map(ms=>setTimeout(again,ms));
    kakao.maps.event.addListener(kmap,'tilesloaded',function h(){kakao.maps.event.removeListener(kmap,'tilesloaded',h);again()});
  };
  const line=(path,dash)=>[
    new kakao.maps.Polyline({path,strokeWeight:dash?6:10,strokeColor:ROUTE_EDGE,strokeOpacity:1,strokeStyle:'solid'}),
    new kakao.maps.Polyline({path,strokeWeight:dash?4:6,strokeColor:ROUTE,strokeOpacity:1,strokeStyle:dash?'shortdash':'solid'})];
  const pin=(pos,name,cls)=>new kakao.maps.CustomOverlay({position:pos,yAnchor:1,zIndex:3,content:`<div class="kpin ${cls}"><span>${esc(name)}</span><i></i></div>`});
  let lines=line([a,b],true);
  klayers=[...lines,pin(a,o.name,'from'),pin(b,v.name,'to')];
  klayers.forEach(x=>x.setMap(kmap));
  fit([a,b]);redrawOnIdle(lines);
  mapRoute=pts=>{ // 도보 경로가 오면 직선 대신 실제 길로
    lines.forEach(l=>l.setMap(null));
    const path=pts.map(([la,ln])=>new kakao.maps.LatLng(la,ln));
    lines=line(path,false);lines.forEach(l=>l.setMap(kmap));
    klayers=[...lines,...klayers.slice(2)];
    fit(path);redrawOnIdle(lines);
  };
  if(pendingRoute){mapRoute(pendingRoute);pendingRoute=null}
}
function drawLeaflet(o,v){
  if(!lmap){
    lmap=L.map('mapbox',{zoomControl:false});lmap.attributionControl.setPrefix(false);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(lmap);
  }

  mapRoute=pts=>{edge.setLatLngs(pts).setStyle({weight:10});line.setLatLngs(pts).setStyle({weight:6,dashArray:null});lmap.fitBounds(line.getBounds(),{padding:[48,48],maxZoom:17})};

async function walkRoute(o,v,seq){
  if(dist(v)>3000)return;
  try{
    const r=await fetch(API+`/api/walk?flat=${o.lat}&flng=${o.lng}&tlat=${v.lat}&tlng=${v.lng}&fname=${encodeURIComponent(o.name)}&tname=${encodeURIComponent(v.name)}`);
    if(!r.ok)return;const w=await r.json();
    if(seq!==mapSeq||!w.path||w.path.length<2)return;
    if(mapRoute)mapRoute(w.path);else pendingRoute=w.path;
    const min=Math.max(1,Math.round(w.seconds/60));
    $('#mapdlg-sub').innerHTML=`<span class="walkt">${ICON.walk}도보 ${min}분</span><i class="dot"></i><span class="mono">${fmtDist(w.meters)}</span><i class="dot"></i>${esc(o.name)}에서`;
  }catch(e){}
}
async function openMap(exId){

/* ---------- 백업·복원 (복원 코드 자동 동기화) ----------
   기기마다 복원 코드가 있고, 저장 데이터가 바뀌면 20초쯤 모았다가 서버에 올림(앱을 닫을 때는 바로).
   다른 기기에서 코드를 넣으면 가져오고, 이후엔 두 기기가 같은 코드로 서로 합쳐 가며 저장 */
const SYNC_KEY='gakkaun-sync';
var SY={};try{SY=JSON.parse(localStorage.getItem(SYNC_KEY))||{}}catch(e){}  // var: 앞쪽 코드의 save()가 먼저 불려도 오류 나지 않게
function saveSY(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}}
function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=new Uint8Array(24);crypto.getRandomValues(b);return [...b].map(x=>A[x%32]).join('')}
const fmtCode=c=>String(c||'').replace(/(.{4})(?=.)/g,'$1-');
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
if(!SY.code){SY.code=newCode();SY.on=true;saveSY()}
if(SY.on===undefined)SY.on=true;
// 백업에 담는 것: 위치 기록은 빼고, 내 선택과 기록만
function syncPayload(){return {v:1,prefs:S.prefs,order:S.order,sort:S.sort,rexp:S.rexp||{},stars:S.stars,visited:S.visited,since:S.since,seen:(S.seen||[]).slice(-1500),vseen:(S.vseen||[]).slice(-1500)}}
const hashStr=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)};
var syncT=null,syncBusy=false,syncErr='';
function syncSoon(){if(!SY||!SY.on||restoring)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(),20000)}
async function syncNow(keepalive){
  if(!SY.on||syncBusy||restoring)return;
  const payload=syncPayload(),h=hashStr(JSON.stringify(payload));
  if(h===SY.last)return;
  syncBusy=true;paintSyncStat();
  try{
    let res=await fetch(API+'/api/sync/save',{method:'POST',keepalive:!!keepalive,headers:{'content-type':'application/json'},body:JSON.stringify({code:SY.code,data:payload,base:SY.base||null})});
    let d=await res.json().catch(()=>({}));
    if(res.status===409&&d.data){ // 다른 기기가 먼저 저장함 → 합쳐서 다시
      mergeInto(d.data);restoring=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}restoring=false;
      SY.base=d.savedAt;
      const p2=syncPayload();
      res=await fetch(API+'/api/sync/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:SY.code,data:p2,base:SY.base})});
      d=await res.json().catch(()=>({}));
      if(res.ok){SY.last=hashStr(JSON.stringify(p2))}
      refreshViewsAfterMerge();
    }else if(res.ok)SY.last=h;
    if(!res.ok)throw new Error(d.error||`서버 오류 (${res.status})`);
    SY.base=d.savedAt;SY.at=d.savedAt;syncErr='';saveSY();
  }catch(e){syncErr=e.message}
  finally{syncBusy=false;paintSyncStat()}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&SY.on){clearTimeout(syncT);syncNow(true)}});
var restoring=false;
// 다른 데이터와 합치기: 별표·관람 기록·하트는 합집합(같은 항목은 이 기기 것 우선), 순서는 이 기기 순서 뒤에 없는 것만 붙임
function mergeInto(r){
  if(!r||typeof r!=='object')return;
  S.prefs=S.prefs||{};Object.entries(r.prefs||{}).forEach(([id,p])=>{if(!S.prefs[id])S.prefs[id]=p});
  const ord=new Set(S.order||[]);(r.order||[]).forEach(id=>{if(!ord.has(id)){S.order.push(id);ord.add(id)}});
  const have=new Set(S.stars.map(s=>s.e&&s.e.id));(r.stars||[]).forEach(s=>{if(s&&s.e&&!have.has(s.e.id)){S.stars.push(s);have.add(s.e.id)}});
  S.visited=S.visited||{};Object.entries(r.visited||{}).forEach(([k,v])=>{if(!S.visited[k])S.visited[k]=v});
  S.seen=[...new Set([...(S.seen||[]),...(r.seen||[])])].slice(-4000);
  S.vseen=[...new Set([...(S.vseen||[]),...(r.vseen||[])])].slice(-3000);
  (r.seen||[]).forEach(k=>seenSet.add(k));(r.vseen||[]).forEach(k=>vseenSet.add(k));
  if(r.since&&(!S.since||r.since<S.since))S.since=r.since;
  S.rexp={...(r.rexp||{}),...(S.rexp||{})};
}
function replaceWith(r){
  S.prefs=r.prefs||{};S.order=r.order||[];S.sort=r.sort||S.sort;S.rexp=r.rexp||{};
  S.stars=r.stars||[];S.visited=r.visited||{};S.since=r.since||S.since;S.seen=r.seen||[];S.vseen=r.vseen||[];
}
function refreshViewsAfterMerge(){near.dirty=true;updateTop();if(tab==='my')renderMy(true);if(tab==='heart')renderHearts();refreshHeartBadge()}
const countsOf=r=>({stars:(r.stars||[]).length,visited:Object.keys(r.visited||{}).length,hearts:Object.values(r.prefs||{}).filter(p=>p&&p.heart).length});

let pendingRestore=null; // {data, savedAt, code?, from:'code'|'file'}
function paintSyncStat(){
  const el=$('#syncstat');if(!el)return;
  el.innerHTML=!SY.on?`<span class="dot off"></span>꺼짐`
    :syncErr?`<span class="dot err"></span>실패 · 다시 시도 중`

    :`<span class="dot"></span>${SY.at?fmtWhen(SY.at):'켜짐'}${SY.passkey?' · Face ID ✓':''}`;
}
function fmtWhen(iso){const t=new Date(iso);return `${t.getMonth()+1}.${pad(t.getDate())} ${pad(t.getHours())}:${pad(t.getMinutes())}`}
// 백업 화면
//  평소: '백업 · 저장 시각 · Face ID ✓' 한 줄 + 스위치. 할 일은 처음 한 번 'Face ID로 보관'뿐
//  기록이 빈 기기(새 기기·지워진 경우): '이전 기록 불러오기'가 맨 위에 크게
//  더보기: 보관(코드 복사·파일) / 가져오기(Face ID·코드·파일)로 나눠 둠
function renderSync(){
  const el=$('#syncsec');if(!el)return;
  const pk=hasPasskey(),c=countsOf(S),empty=!c.stars&&!c.visited&&!c.hearts;
  el.innerHTML=`<div class="synchead"><h3>백업</h3><span class="syncstat" id="syncstat"></span>
      <label class="switch"><input type="checkbox" id="syncon" ${SY.on?'checked':''}><span class="track"></span><span class="sr">자동 백업</span></label></div>
    ${empty?`<div class="syncrow"><button class="btn sm" data-act="${pk?'pk-restore':'open-more'}">이전 기록 불러오기</button></div>`:''}
    ${pk&&!SY.passkey&&!empty?`<div class="syncrow"><button class="btn sm" data-act="pk-save">Face ID로 보관</button></div>`:''}
    <div id="restorebox"></div>
    <details id="restoredet"><summary>더보기</summary>
      <div class="morerow"><span class="morelab">보관</span>
        ${pk?`<button class="linkbtn" data-act="pk-save">${SY.passkey?'Face ID 다시 보관':'Face ID'}</button>`:''}
        <button class="linkbtn" data-act="code-copy">코드 복사</button>
        <button class="linkbtn" data-act="file-export">파일</button></div>
      <div class="morerow"><span class="morelab">가져오기</span>
        ${pk?'<button class="linkbtn" data-act="pk-restore">Face ID</button>':''}
        <button class="linkbtn" data-act="show-codeform">코드</button>
        <label class="linkbtn">파일<input type="file" id="importfile" accept="application/json,.json" hidden></label></div>
      <form class="codebox" id="restoreform" hidden><input class="field" id="restorecode" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="복원 코드"><button class="btn sm" type="submit" id="restorebtn">불러오기</button></form>
    </details>`;
  paintSyncStat();paintRestore();
}
const hasPasskey=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
/* 패스키(Face ID): 복원 코드를 패스키의 사용자 id에 담아 iCloud 키체인에 보관.
   복원할 때 패스키를 고르면 그 id(=코드)가 돌아옴 → 서버에서 백업을 불러옴. 서버 검증은 필요 없음 */
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function passkeySave(){
  try{
    await navigator.credentials.create({publicKey:{
      challenge:rnd(32),rp:{name:'가까운 전시'},
      user:{id:new TextEncoder().encode(SY.code),name:'가까운 전시 백업',displayName:'가까운 전시 백업 '+SY.code.slice(-4)},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{residentKey:'required',requireResidentKey:true,userVerification:'preferred'},
      timeout:60000,attestation:'none'}});
    SY.passkey=true;saveSY();renderSync();toast('Face ID로 보관했어요');
    SY.last='';syncNow();
  }catch(e){if(e&&e.name!=='NotAllowedError')toast('보관하지 못했어요: '+(e.message||e.name))}
}
async function passkeyRestore(){
  try{
    const cred=await navigator.credentials.get({publicKey:{challenge:rnd(32),userVerification:'preferred',timeout:60000}});
    const uh=cred&&cred.response&&cred.response.userHandle;
    if(!uh){toast('보관된 코드를 찾지 못했어요');return}
    const code=new TextDecoder().decode(uh);
    if(normCode(code)===SY.code){SY.passkey=true;saveSY();toast('이 기기의 백업이에요. 이미 최신이에요');renderSync();return}
    await loadFromCode(code);
    if(pendingRestore)pendingRestore.viaPasskey=true;
  }catch(e){if(e&&e.name!=='NotAllowedError')toast('복원하지 못했어요: '+(e.message||e.name))}
}
function paintRestore(){
  const box=$('#restorebox');if(!box)return;
  if(restoreMsg){box.innerHTML=`<p class="note ${restoreMsg.err?'bad':''}" style="margin:8px 0 0">${esc(restoreMsg.text)}</p>`;return}
  if(!pendingRestore){box.innerHTML='';return}
  const r=countsOf(pendingRestore.data),l=countsOf(S);
  box.innerHTML=`<div class="restorebox">
    <p><b>${pendingRestore.savedAt?fmtWhen(pendingRestore.savedAt):'백업'}</b> <span class="mono">♥${r.stars} · 관람 ${r.visited} · ★${r.hearts}</span></p>
    <p class="note" style="margin:0">이 기기 <span class="mono">♥${l.stars} · 관람 ${l.visited} · ★${l.hearts}</span></p>
    <div class="syncrow"><button class="btn sm" data-act="restore-merge">합치기</button><button class="btn ghost sm" data-act="restore-replace">바꾸기</button><button class="btn ghost sm" data-act="restore-cancel">취소</button></div>
  </div>`;
}
var restoreMsg=null;
async function loadFromCode(code){
  code=normCode(code);pendingRestore=null;
  if(code.length<20){restoreMsg={err:true,text:'코드를 확인해 주세요'};paintRestore();return}
  if(code===SY.code){restoreMsg={err:true,text:'이 기기의 코드예요'};paintRestore();return}
  const b=$('#restorebtn');if(b){b.disabled=true;b.textContent='찾는 중…'}
  restoreMsg={text:'찾는 중…'};paintRestore();
  try{const r=await api('/api/sync/load',{code});restoreMsg=null;pendingRestore={data:r.data,savedAt:r.savedAt,code,from:'code'}}
  catch(e){restoreMsg={err:true,text:e.message}}
  finally{if(b){b.disabled=false;b.textContent='불러오기'}paintRestore()}
}
function applyRestore(mode){
  const pr=pendingRestore;if(!pr)return;
  restoring=true;
  if(mode==='replace')replaceWith(pr.data);else mergeInto(pr.data);
  seenSet.clear();(S.seen||[]).forEach(k=>seenSet.add(k));vseenSet.clear();(S.vseen||[]).forEach(k=>vseenSet.add(k));
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  restoring=false;
  if(pr.code){if(pr.code!==SY.code)SY.passkey=!!pr.viaPasskey;SY.code=pr.code;SY.base=pr.savedAt;SY.last='';saveSY()}
  pendingRestore=null;allVenues=null;
  toast(mode==='replace'?'백업 기록으로 바꿨어요':'기록을 합쳤어요');
  renderSettings();refreshViewsAfterMerge();syncNow();
}
function exportFile(){
  const blob=new Blob([JSON.stringify({app:'gakkaun-jeonsi',exportedAt:new Date().toISOString(),data:syncPayload()},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`가까운전시-백업-${localYmd()}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
document.addEventListener('change',ev=>{
  if(ev.target.id!=='importfile')return;
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  f.text().then(t=>{const j=JSON.parse(t);const d=j.data||j;if(!d||(!d.stars&&!d.visited&&!d.prefs))throw new Error('가까운 전시 백업 파일이 아니에요');
    restoreMsg=null;pendingRestore={data:d,savedAt:j.exportedAt||null,from:'file'};const det=$('#restoredet');if(det)det.open=true;paintRestore()}).catch(e=>{restoreMsg={err:true,text:e.message||'파일을 읽지 못했어요'};paintRestore()});
  ev.target.value='';
});
document.addEventListener('change',ev=>{
  if(ev.target.id!=='syncon')return;
  SY.on=ev.target.checked;saveSY();paintSyncStat();if(SY.on){SY.last='';syncNow()}
  toast(SY.on?'자동 백업 켬':'자동 백업 끔');
});
document.addEventListener('submit',ev=>{
  if(ev.target.id==='restoreform'){ev.preventDefault();loadFromCode(($('#restorecode')||{}).value)}
});
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t||!t.dataset.act)return;const a=t.dataset.act;
  if(a==='code-copy'){(navigator.clipboard?navigator.clipboard.writeText(fmtCode(SY.code)):Promise.reject()).then(()=>toast('코드를 복사했어요')).catch(()=>{window.prompt('복원 코드',fmtCode(SY.code))})}
  else if(a==='file-export')exportFile();
  else if(a==='restore-merge')applyRestore('merge');
  else if(a==='restore-replace')armed(t,'한 번 더',()=>applyRestore('replace'));
  else if(a==='pk-save')passkeySave();
  else if(a==='open-more'){const d=$('#restoredet');if(d)d.open=true;const f=$('#restoreform');if(f){f.hidden=false;$('#restorecode').focus()}}
  else if(a==='show-codeform'){const f=$('#restoreform');if(f){f.hidden=!f.hidden;if(!f.hidden)$('#restorecode').focus()}}
  else if(a==='pk-restore')passkeyRestore();
  else if(a==='restore-cancel'){pendingRestore=null;restoreMsg=null;paintRestore()}
});

save();
show((location.hash||'').slice(1)||'near');
// 예전 화면이 캐시에 남아 있으면 새 버전으로 한 번 새로 고침
const APP_VER='2026-10-03.53';
let verAt=0;
function checkVer(){
  verAt=Date.now();
  return api('/api/status').then(st=>{
    statusCache=st;
    if(st.version&&st.version!==APP_VER){
      let k='gj-reload-'+st.version,done=false;try{done=!!sessionStorage.getItem(k);sessionStorage.setItem(k,'1')}catch(e){done=true}
      if(!done)location.replace(location.pathname+'?v='+encodeURIComponent(st.version)+location.hash);
    }
  }).catch(()=>{});
}
checkVer();
// 홈 화면 앱은 껐다 켜도 실제로는 이어서 열리는 경우가 많아서, 다시 앞으로 올 때마다 새 버전 확인(1분 간격)
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-verAt>60000)checkVer()});
window.addEventListener('pageshow',e=>{if(e.persisted&&Date.now()-verAt>60000)checkVer()});
setTimeout(refreshHeartBadge,1500);
setTimeout(()=>loadAll().then(updateSetBadge).catch(()=>{}),1800);
})();
</script>
